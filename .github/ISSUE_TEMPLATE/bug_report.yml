name: Bug report
description: Something does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove personal data first: phone numbers, names, message text,
        tokens, passphrases and file paths that contain your user name. Use placeholders.
        For a security problem, do not open an issue. See the security policy.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the bridge with ...
        2. Ask the assistant to run ...
        3. See the error ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bridge (login, sync, sending, API)
        - MCP server or a tool
        - Python SDK
        - Transcription
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `wa-bridge --version`, or the commit you built from.
      placeholder: wa-bridge 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: The assistant or client you use, if the problem involves the MCP server.
      placeholder: Claude Desktop, Claude Code, Cursor, Windsurf, VS Code
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: The keys of `config.json` that matter here. Leave out secrets and personal paths.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Bridge log lines, the error returned by the tool, or the traceback. Redact personal data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I read the FAQ and the troubleshooting tables in the documentation.
          required: true
        - label: I removed phone numbers, message text, tokens and passphrases from this report.
          required: true
