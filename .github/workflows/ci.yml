name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Install ffmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg

      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y }

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy --strict

      - name: pytest
        run: uv run pytest

      - name: Windows stdio with the speech backend installed
        if: runner.os == 'Windows'
        run: |
          uv sync --locked --inexact --all-packages --extra faster-whisper
          uv run --no-sync pytest server/tests/test_accounts_server.py -k stdio_reports_optional_speech_backend

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Audit the locked Python packages (all extras)
        run: |
          uv export --locked --all-packages --all-extras --no-emit-workspace --format requirements-txt -o requirements-audit.txt
          uvx pip-audit==2.9.0 --disable-pip --no-deps --strict -r requirements-audit.txt

  docker:
    name: Docker images and compose preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the bridge image
        run: docker build -f Dockerfile.bridge -t wa-mcp-bridge:local ../..

      - name: Build the server image
        run: docker build -f Dockerfile.server -t wa-mcp-server:local ../..

      # The documented steps (docs/guides/server.md): .env from env.example, the key, then up.
      - name: Settings and key as documented
        run: |
          cp env.example .env
          sed -i 's/^WA_MCP_DOMAIN=.*/WA_MCP_DOMAIN=wa.example.test/; s/^WA_MCP_PORT=.*/WA_MCP_PORT=/' .env
          sh secrets/make-key.sh &
          first=$!
          sh secrets/make-key.sh
          wait "$first"
          test "$(sudo stat -c '%u %a' secrets/wa_mcp.key)" = "65532 600"
          sudo grep -Eq '^[[:xdigit:]]{64}$' secrets/wa_mcp.key
          digest=$(sudo sha256sum secrets/wa_mcp.key)
          sh secrets/make-key.sh
          test "$digest" = "$(sudo sha256sum secrets/wa_mcp.key)"

      - name: Resolved compose file uses the key file
        run: |
          docker compose -f compose.yaml -f compose.preview.yaml config > resolved.yaml
          grep -q 'WA_MCP_ENCRYPTION_MODE: keyfile' resolved.yaml
          grep -q 'WA_MCP_KEY_FILE: /run/secrets/wa_mcp_key' resolved.yaml
          grep -q 'TZ: UTC' resolved.yaml

      - name: Start the preview stack (no WhatsApp)
        run: docker compose -f compose.yaml -f compose.preview.yaml up -d --wait --wait-timeout 120

      - name: Health checks and the key inside the containers
        run: |
          docker compose -f compose.yaml -f compose.preview.yaml exec -T server python -c "from wa_mcp.agent.providers import DEFAULT_PROMPT; assert DEFAULT_PROMPT.read_text(encoding='utf-8').strip()"
          endpoint=$(docker compose -f compose.yaml -f compose.preview.yaml port bridge 8765)
          curl -fsS "http://$endpoint/health"
          docker compose -f compose.yaml -f compose.preview.yaml exec -T bridge /usr/local/bin/wa-bridge health
          docker compose -f compose.yaml -f compose.preview.yaml exec -T server wa-mcp health
          docker compose -f compose.yaml -f compose.preview.yaml exec -T server python -c "from wa_mcp import keystore; keystore.read_key_file('/run/secrets/wa_mcp_key')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://$endpoint/mcp" -H 'Host: wa.example.test')" = "401"

      - name: Logs
        if: always()
        run: docker compose -f compose.yaml -f compose.preview.yaml logs --no-color

      - name: Stop
        if: always()
        run: docker compose -f compose.yaml -f compose.preview.yaml down -v

  remote-newest-mcp:
    name: Remote mode with the newest mcp 1.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true

      # remote/sdk.py uses parts of the SDK that are not its documented surface; catch changes early.
      - name: Install with the newest mcp below 2
        run: |
          uv sync --locked
          uv pip install --upgrade "mcp>=1.30,<2"

      - name: Remote tests
        run: uv run --no-sync pytest server/tests/test_remote_units.py server/tests/test_remote_http.py server/tests/test_remote_oauth.py

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Links and images
        run: uv run python scripts/check_links.py

      - name: OpenAPI copy
        run: uv run python scripts/check_openapi_sync.py

      - name: config.example.json (Go and Python defaults)
        run: uv run python scripts/check_config_example.py

      - name: Tool reference
        run: uv run python scripts/gen_tool_reference.py --check

      - name: whatsmeow schema used by the Python tests
        run: |
          (cd bridge && go mod download go.mau.fi/whatsmeow)
          uv run pytest sdk/python/tests/test_core.py -k whatsmeow_schema
        env:
          WA_MCP_REQUIRE_GO: "1"
