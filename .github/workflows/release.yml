name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the release version
        id: release
        run: |
          version=$(jq -er '.version' server.json)
          test "$GITHUB_REF_NAME" = "v$version"
          image="ghcr.io/tsahospital-beep/wa-mcp-server:$version"
          jq -e --arg image "$image" 'any(.packages[]; .registryType == "oci" and .identifier == $image)' server.json
          grep -Fq "## [$version] -" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the bridge
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.bridge
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.release.outputs.version }}
          tags: ghcr.io/tsahospital-beep/wa-mcp-bridge:${{ steps.release.outputs.version }}
          push: true

      - name: Build and push the server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/tsahospital-beep/wa-mcp-server:${{ steps.release.outputs.version }}
          push: true

  release:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pack the Claude Desktop extension
        run: |
          test "$(jq -r .version mcpb/manifest.json)" = "${GITHUB_REF_NAME#v}"
          npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb "$RUNNER_TEMP/wa-mcp.mcpb"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == "[" version "]"); next }
            /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > "$notes"
          grep -q '[^[:space:]]' "$notes"
          sed -i "s|](docs/|](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/|g" "$notes"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/wa-mcp.mcpb" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$notes"

  python-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Build both packages
        run: |
          uv build --package wa-mcp-sdk -o dist/sdk
          uv build --package wa-mcp-server -o dist/server
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  pypi-sdk:
    needs: python-dist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdk/
          skip-existing: true

  pypi-server:
    needs: pypi-sdk
    runs-on: ubuntu-latest
    environment: pypi-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/server/
          skip-existing: true
