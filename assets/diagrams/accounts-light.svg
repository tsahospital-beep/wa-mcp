<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title description">
  <title id="title">WA MCP | Multiple accounts</title>
  <desc id="description">wa-bridge run-all supervises default and work bridge instances with separate stores. The MCP server uses the account argument to route tool calls to the selected bridge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#00a884" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .host { fill: none; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .rule { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .flow { fill: none; stroke: #00a884; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .symbol { fill: none; stroke: #00a884; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .project { font-size: 15px; font-weight: 600; letter-spacing: 0.6px; }
    .heading { font-size: 24px; font-weight: 600; }
    .label { font-size: 16px; font-weight: 600; }
    .detail { font-size: 13px; fill: #57606a; }
    .step { font-size: 15px; font-weight: 600; }
  </style>
  <g id="heading">
    <g transform="translate(24 26) scale(0.625)">
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd383"/><stop offset="1" stop-color="#009a74"/></linearGradient></defs>
  <rect width="48" height="48" rx="13" fill="url(#g)"/>
  <path d="M24 11.5c-7 0-12.5 5.1-12.5 11.5 0 3.3 1.5 6.3 3.9 8.4l-1.2 5 5.2-2.6c1.4.5 3 .7 4.6.7 7 0 12.5-5.1 12.5-11.5S31 11.5 24 11.5z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M19.6 23.6l8-3.9M19.6 23.6l8 3.9" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
  <circle cx="19.2" cy="23.6" r="2.5" fill="#fff"/><circle cx="28.6" cy="19.3" r="2.5" fill="#fff"/><circle cx="28.6" cy="27.9" r="2.5" fill="#fff"/>
</svg>
    </g>
    <text class="project" x="66" y="47" text-anchor="start">WA MCP</text>
    <path class="rule" d="M147 27v28"/>
    <text class="heading" x="165" y="49" text-anchor="start">Multiple accounts</text>
    <path class="rule" d="M24 79H976"/>
  </g>
  <!-- Supervisor and server -->
    <rect class="box" x="28" y="198" width="220" height="132" rx="14"/>
    <g class="symbol" transform="translate(126.0 238.0)"><rect x="8" y="2" width="8" height="5" rx="1"/><rect x="1" y="16" width="8" height="5" rx="1"/><rect x="15" y="16" width="8" height="5" rx="1"/><path d="M12 7v4m-7 5v-5h14v5"/></g>
    <text class="label" x="138.0" y="289.0" text-anchor="middle">wa-bridge run-all</text>
    <rect class="box" x="752" y="198" width="220" height="132" rx="14"/>
    <g class="symbol" transform="translate(850.0 228.0)"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M6 6.5h2m-2 11h2"/></g>
    <text class="label" x="862.0" y="279.0" text-anchor="middle">wa-mcp server</text>
    <text class="detail" x="862.0" y="299.0" text-anchor="middle">tools take account</text>
  <!-- Account-specific bridge instances -->
    <rect class="box" x="390" y="111" width="220" height="126" rx="14"/>
    <g class="symbol" transform="translate(488.0 138.0)"><path d="M2 17h20M5 20V7m14 13V7M5 9q7 12 14 0M9 14v3m6-3v3"/></g>
    <text class="label" x="500.0" y="189.0" text-anchor="middle">bridge: default</text>
    <text class="detail" x="500.0" y="209.0" text-anchor="middle">(store/)</text>
    <rect class="box" x="390" y="291" width="220" height="126" rx="14"/>
    <g class="symbol" transform="translate(488.0 318.0)"><path d="M2 17h20M5 20V7m14 13V7M5 9q7 12 14 0M9 14v3m6-3v3"/></g>
    <text class="label" x="500.0" y="369.0" text-anchor="middle">bridge: work</text>
    <text class="detail" x="500.0" y="389.0" text-anchor="middle">(store/work)</text>
  <!-- Supervision and tool routing -->
    <path class="flow" d="M249 264h58"/>
    <path class="flow" d="M307 264v-84q0-6 6-6h75" marker-end="url(#arrow)"/>
    <path class="flow" d="M307 264v84q0 6 6 6h75" marker-end="url(#arrow)"/>
    <text class="detail" x="318" y="253" text-anchor="start">supervises</text>
    <path class="flow" d="M751 264h-58"/>
    <path class="flow" d="M693 264v-84q0-6-6-6h-75" marker-end="url(#arrow)"/>
    <path class="flow" d="M693 264v84q0 6-6 6h-75" marker-end="url(#arrow)"/>
</svg>
