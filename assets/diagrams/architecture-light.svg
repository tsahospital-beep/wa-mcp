<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">WA MCP | Local architecture</title>
  <desc id="description">WhatsApp connects the phone to wa-bridge using the end-to-end encrypted protocol. The Python server uses the local HTTP API and reads the bridge store. The AI client connects over stdio. The bridge sends signed webhook requests.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#00a884" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .host { fill: none; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .rule { fill: none; stroke: #d0d7de; stroke-width: 1.5; }
    .flow { fill: none; stroke: #00a884; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .symbol { fill: none; stroke: #00a884; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .project { font-size: 15px; font-weight: 600; letter-spacing: 0.6px; }
    .heading { font-size: 24px; font-weight: 600; }
    .label { font-size: 16px; font-weight: 600; }
    .detail { font-size: 13px; fill: #57606a; }
    .step { font-size: 15px; font-weight: 600; }
  </style>
  <g id="heading">
    <g transform="translate(24 26) scale(0.625)">
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fd383"/><stop offset="1" stop-color="#009a74"/></linearGradient></defs>
  <rect width="48" height="48" rx="13" fill="url(#g)"/>
  <path d="M24 11.5c-7 0-12.5 5.1-12.5 11.5 0 3.3 1.5 6.3 3.9 8.4l-1.2 5 5.2-2.6c1.4.5 3 .7 4.6.7 7 0 12.5-5.1 12.5-11.5S31 11.5 24 11.5z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M19.6 23.6l8-3.9M19.6 23.6l8 3.9" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
  <circle cx="19.2" cy="23.6" r="2.5" fill="#fff"/><circle cx="28.6" cy="19.3" r="2.5" fill="#fff"/><circle cx="28.6" cy="27.9" r="2.5" fill="#fff"/>
</svg>
    </g>
    <text class="project" x="66" y="47" text-anchor="start">WA MCP</text>
    <path class="rule" d="M147 27v28"/>
    <text class="heading" x="165" y="49" text-anchor="start">Local architecture</text>
    <path class="rule" d="M24 79H1176"/>
  </g>
  <!-- External services -->
    <rect class="box" x="24" y="230" width="109" height="106" rx="14"/>
    <g class="symbol" transform="translate(66.5 247.0)"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></g>
    <text class="label" x="78.5" y="298.0" text-anchor="middle">Phone</text>
    <text class="detail" x="78.5" y="318.0" text-anchor="middle">(WhatsApp)</text>
    <rect class="box" x="168" y="230" width="137" height="106" rx="14"/>
    <g class="symbol" transform="translate(224.5 247.0)"><path d="M6 19a5 5 0 0 1-1-9.9A7 7 0 0 1 18.5 8a5.5 5.5 0 0 1 0 11Z"/></g>
    <text class="label" x="236.5" y="298.0" text-anchor="middle">WhatsApp</text>
    <text class="detail" x="236.5" y="318.0" text-anchor="middle">servers</text>
    <rect class="box" x="1020" y="224" width="156" height="118" rx="14"/>
    <g class="symbol" transform="translate(1086.0 237.0)"><rect x="2" y="3" width="20" height="14" rx="2.5"/><path d="M8 21h8m-4-4v4"/></g>
    <text class="label" x="1098.0" y="288.0" text-anchor="middle">AI client</text>
    <text class="detail" x="1098.0" y="308.0" text-anchor="middle">(Claude, Cursor,</text>
    <text class="detail" x="1098.0" y="328.0" text-anchor="middle">VS Code, ...)</text>
    <rect class="box" x="152" y="465" width="168" height="88" rx="14"/>
    <g class="symbol" transform="translate(224.0 483.0)"><circle cx="5" cy="12" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m7.2 10.8 8.6-4.6m-8.6 7 8.6 4.6"/></g>
    <text class="label" x="236.0" y="534.0" text-anchor="middle">Your webhook URL</text>
  <!-- Local processes -->
    <rect class="box" x="355" y="150" width="249" height="403" rx="14"/>
    <g class="symbol" transform="translate(373 168)"><path d="M2 17h20M5 20V7m14 13V7M5 9q7 12 14 0M9 14v3m6-3v3"/></g>
    <text class="label" x="407" y="187" text-anchor="start">wa-bridge (Go)</text>
    <path class="rule" d="M355 207h249"/>
    <text class="detail" x="378" y="245" text-anchor="start">login window</text>
    <text class="detail" x="378" y="281" text-anchor="start">HTTP API v1 (token)</text>
    <text class="detail" x="378" y="317" text-anchor="start">scheduler</text>
    <text class="detail" x="378" y="353" text-anchor="start">human-like sender</text>
    <text class="detail" x="378" y="389" text-anchor="start">webhooks</text>
    <rect class="box" x="370" y="423" width="219" height="112" rx="14"/>
    <g class="symbol" transform="translate(387 437)"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></g>
    <text class="detail" x="387" y="485" text-anchor="start">store: wa.db (encrypted fields),</text>
    <text class="detail" x="387" y="507" text-anchor="start">session.db</text>
    <rect class="box" x="724" y="150" width="236" height="244" rx="14"/>
    <g class="symbol" transform="translate(741 168)"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M6 6.5h2m-2 11h2"/></g>
    <text class="label" x="776" y="187" text-anchor="start">wa-mcp server (Python)</text>
    <path class="rule" d="M724 207h236"/>
    <text class="detail" x="745" y="245" text-anchor="start">MCP tools</text>
    <text class="detail" x="745" y="281" text-anchor="start">insight: tasks, analytics, my_day</text>
    <text class="detail" x="745" y="317" text-anchor="start">transcription</text>
    <text class="detail" x="745" y="353" text-anchor="start">OCR</text>
  <!-- Connections -->
    <path class="flow" d="M134 283h32" marker-end="url(#arrow)"/>
    <path class="flow" d="M236.5 228v-42q0-6 6-6H353" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="detail" x="237" y="139" text-anchor="middle">end-to-end encrypted</text>
    <text class="detail" x="237" y="158" text-anchor="middle">protocol</text>
    <path class="flow" d="M723 277H606" marker-end="url(#arrow)"/>
    <text class="detail" x="664" y="263" text-anchor="middle">HTTP 127.0.0.1</text>
    <path class="flow" d="M962 283h56" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="detail" x="990" y="269" text-anchor="middle">stdio</text>
    <path class="flow" d="M842 395v78q0 6-6 6H591" marker-end="url(#arrow)"/>
    <text class="detail" x="713" y="466" text-anchor="middle">read-only</text>
    <path class="flow" d="M354 385H242q-6 0-6 6v72" marker-end="url(#arrow)"/>
    <text class="detail" x="248" y="424" text-anchor="start">signed POST</text>
</svg>
