[project]
name = "wa-mcp-sdk"
version = "0.2.0"
description = "Python library for the wa-mcp WhatsApp bridge: local database, bridge API, transcription, exports"
license = "MIT"
authors = [{ name = "tsahospital-beep" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
encryption = ["cryptography>=43.0.0", "argon2-cffi>=23.1.0"]
faster-whisper = ["faster-whisper>=1.1.0"]
openai-whisper = ["openai-whisper>=20240930"]
files = ["pypdf>=5.0.0", "rarfile>=4.2"]
ocr = ["rapidocr-onnxruntime>=1.4.0"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wa_mcp"]

[tool.hatch.build.hooks.custom]
