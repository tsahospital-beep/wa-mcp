[project]
name = "wa-mcp-server"
version = "0.1.1"
description = "MCP server (stdio and Streamable HTTP) that gives AI assistants access to a wa-mcp WhatsApp bridge"
license = "MIT"
authors = [{ name = "tsahospital-beep" }]
requires-python = ">=3.11"
dependencies = [
    "wa-mcp-sdk>=0.1.1",
    "mcp~=1.30",
]

[project.scripts]
wa-mcp = "wa_mcp_server.app:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wa_mcp_server"]
